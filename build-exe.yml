# GitHub Actions: 在云端(无需本机安装 Python)自动打包出 Windows .exe
# 用法：把本项目推到 GitHub 仓库后，即可在 Actions 页手动“Run workflow”打包；
#       也可在 push 到 main/master 时自动触发。
name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:      # 允许在 Actions 页面手动点 “Run workflow” 打包

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest            # 使用 GitHub 自带的 Windows 官方 Python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mss opencv-python numpy pillow python-pptx pyinstaller

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "ScreenCapturePPT" `
            --collect-data pptx `
            --collect-all PIL `
            --collect-all cv2 `
            --hidden-import mss `
            --hidden-import PIL._tkinter_finder `
            scripts\screen_capture_gui.py

      - name: Verify exe exists
        run: |
          if (Test-Path "dist\ScreenCapturePPT.exe") {
            Write-Host "BUILD OK -> dist\ScreenCapturePPT.exe"
            Get-Item "dist\ScreenCapturePPT.exe" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          } else {
            Write-Error "Failed: dist\ScreenCapturePPT.exe not generated"
            exit 1
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapturePPT
          path: dist\ScreenCapturePPT.exe
          if-no-files-found: error     # 若没生成 exe 则让任务失败，便于发现问题
          retention-days: 30           # 构建产物保留 30 天